<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>The Body Museum 🏛️</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#12313b; --paper:#fdf7ec; --paper2:#f5ead6;
  --brass:#c99a3f; --brass-dark:#8f6b21;
  --deep:#0d2630; --deep2:#153b48;
  --ok:#2f9e5f; --bad:#d1495b;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
body{
  min-height:100svh; color:var(--paper);
  font-family:"Nunito",system-ui,sans-serif;
  background:
    radial-gradient(120% 80% at 50% -10%, #1d5566 0%, transparent 60%),
    linear-gradient(175deg,var(--deep2) 0%,var(--deep) 55%,#081a22 100%);
  background-attachment:fixed;
  padding:0 14px calc(28px + env(safe-area-inset-bottom));
}
h1,h2,h3,.f{font-family:"Fredoka",system-ui,sans-serif;font-weight:600}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer}
.wrap{max-width:560px;margin:0 auto}

/* ---------- top bar ---------- */
header{
  position:sticky;top:0;z-index:20;
  display:flex;align-items:center;gap:10px;
  padding:calc(10px + env(safe-area-inset-top)) 2px 10px;
  background:linear-gradient(180deg,rgba(8,26,34,.96) 60%,rgba(8,26,34,0));
}
#back{
  display:none;width:44px;height:44px;border-radius:14px;flex:none;
  background:rgba(253,247,236,.1);border:1px solid rgba(201,154,63,.35);
  font-size:1.3rem;line-height:1;
}
#back.on{display:block}
.brand{flex:1;min-width:0;font-size:1.05rem;letter-spacing:.3px;color:#eadfc7;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brand b{color:var(--brass);font-weight:600}
.stars{
  flex:none;display:flex;align-items:center;gap:5px;height:40px;padding:0 13px;
  border-radius:20px;background:linear-gradient(180deg,#f2d089,#c99a3f);
  color:#412d05;font-family:"Fredoka";font-weight:600;font-size:1rem;
  box-shadow:0 3px 0 #7d5b17;
}

/* ---------- generic screen ---------- */
.screen{display:none;animation:in .25s ease}
.screen.on{display:block}
@keyframes in{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}

.hero{text-align:center;padding:6px 0 20px}
.hero .mark{font-size:3.6rem;line-height:1;filter:drop-shadow(0 6px 10px rgba(0,0,0,.4))}
.hero h1{font-size:2rem;margin-top:6px;color:#fdf7ec;letter-spacing:.5px}
.hero p{color:#9dbecb;font-size:.95rem;margin-top:6px}

.tiles{display:grid;gap:12px}
.tile{
  display:flex;align-items:center;gap:14px;width:100%;min-height:74px;
  padding:14px 18px;border-radius:20px;text-align:left;
  background:linear-gradient(135deg,var(--c1),var(--c2));
  color:#0e2229;box-shadow:0 6px 0 rgba(0,0,0,.28);
  transition:transform .08s,box-shadow .08s;
}
.tile:active{transform:translateY(4px);box-shadow:0 2px 0 rgba(0,0,0,.28)}
.tile .e{font-size:2.2rem;line-height:1;flex:none}
.tile .n{font-family:"Fredoka";font-weight:600;font-size:1.2rem}
.tile .s{font-size:.82rem;opacity:.72;font-weight:700}
.tile.done .n::after{content:" ✓"}

.sect{margin:22px 0 10px;color:#8fb3c1;font-size:.8rem;letter-spacing:2px;text-transform:uppercase}

/* ---------- exhibit card ---------- */
.plate{
  background:var(--paper);color:var(--ink);border-radius:22px;overflow:hidden;
  box-shadow:0 10px 26px rgba(0,0,0,.4);border:1px solid rgba(0,0,0,.08);
}
.plate .pic{position:relative;aspect-ratio:16/10;overflow:hidden;
  background:linear-gradient(135deg,#e8dcc4,#dccfb2)}
.plate .pic img{width:100%;height:100%;object-fit:contain;display:block}
.plate .pic .ico{position:absolute;inset:0;display:none;align-items:center;justify-content:center;font-size:4.5rem}
.plate .pic.noimg{aspect-ratio:auto;height:112px;background:linear-gradient(135deg,var(--paper2),#e9dcc2)}
.plate .pic.noimg .ico{display:flex}
.plate .body{padding:16px 18px 20px}
.plate .tag{display:inline-block;font-family:"Fredoka";font-size:.72rem;letter-spacing:1.5px;
  text-transform:uppercase;color:#fff;background:var(--accent,#2ec4d9);
  padding:4px 10px;border-radius:8px}
.plate h2{font-size:1.35rem;margin:9px 0 8px;color:#0f2f3a}
.plate p{font-size:1.02rem;line-height:1.55;color:#33474f}
.plate .hi{background:linear-gradient(180deg,transparent 58%,#fff07a 58%);padding:0 1px}

.rowbtns{display:flex;gap:10px;align-items:center;margin-top:14px}
.rnd{
  width:52px;height:52px;flex:none;border-radius:50%;
  background:rgba(253,247,236,.1);border:1px solid rgba(201,154,63,.4);
  font-size:1.3rem;display:grid;place-items:center;
}
.rnd:disabled{opacity:.3}
.rnd.speak{background:linear-gradient(180deg,#f2d089,#c99a3f);color:#412d05;border-color:transparent;box-shadow:0 3px 0 #7d5b17}
.dots{flex:1;display:flex;gap:5px;justify-content:center;flex-wrap:wrap}
.dot{width:8px;height:8px;border-radius:50%;background:rgba(253,247,236,.25)}
.dot.on{background:var(--brass);transform:scale(1.35)}

.vocab{margin-top:14px;background:rgba(253,247,236,.07);border:1px solid rgba(201,154,63,.25);
  border-radius:16px;padding:12px 16px}
.vocab h3{font-size:.78rem;letter-spacing:2px;text-transform:uppercase;color:var(--brass);margin-bottom:8px}
.vocab li{list-style:none;font-size:.95rem;color:#dcefe6;margin:5px 0}
.vocab li b{color:#fff}

/* ---------- quiz ---------- */
.qbar{height:8px;border-radius:6px;background:rgba(253,247,236,.14);overflow:hidden;margin-bottom:14px}
.qbar i{display:block;height:100%;background:linear-gradient(90deg,#f2d089,#c99a3f);transition:width .3s}
.qtext{font-family:"Fredoka";font-size:1.28rem;line-height:1.35;text-align:center;margin:8px 0 16px;color:#fdf7ec}
.opts{display:grid;gap:10px}
.opt{
  width:100%;min-height:56px;padding:13px 16px;border-radius:16px;text-align:left;
  background:var(--paper);color:var(--ink);font-weight:700;font-size:1.02rem;
  box-shadow:0 4px 0 rgba(0,0,0,.3);transition:transform .08s,box-shadow .08s;
}
.opt:active{transform:translateY(3px);box-shadow:0 1px 0 rgba(0,0,0,.3)}
.opt.ok{background:#c9f2d8;box-shadow:0 4px 0 #1f7a45}
.opt.bad{background:#ffd4da;box-shadow:0 4px 0 #93233a}
.opt[disabled]{opacity:.62}
.msg{text-align:center;min-height:2rem;margin-top:14px;font-family:"Fredoka";font-size:1.1rem}

/* ---------- match ---------- */
.word{
  background:var(--paper);color:var(--ink);border-radius:20px;padding:26px 16px;text-align:center;
  font-family:"Fredoka";font-size:1.9rem;box-shadow:0 8px 20px rgba(0,0,0,.35);
}
.senses{display:grid;grid-template-columns:repeat(auto-fit,minmax(96px,1fr));gap:9px;margin-top:16px}
.sense{
  padding:13px 6px;border-radius:16px;text-align:center;font-weight:800;font-size:.95rem;
  background:rgba(253,247,236,.1);border:1px solid rgba(201,154,63,.32);color:#f0e6d2;
}
.sense .e{display:block;font-size:1.7rem;margin-bottom:3px}
.sense.ok{background:#2f9e5f;border-color:#2f9e5f;color:#fff}
.sense.bad{background:#d1495b;border-color:#d1495b;color:#fff}

/* ---------- timeline ---------- */
.slots{display:flex;gap:6px;margin-bottom:16px}
.slot{flex:1;height:64px;border-radius:14px;border:2px dashed rgba(201,154,63,.4);
  display:grid;place-items:center;font-size:1.6rem;background:rgba(253,247,236,.05)}
.slot.f{border-style:solid;border-color:var(--brass);background:rgba(201,154,63,.18)}
.pool{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px}
.chip{
  display:flex;align-items:center;gap:10px;padding:12px 14px;border-radius:16px;
  background:var(--paper);color:var(--ink);font-weight:800;box-shadow:0 4px 0 rgba(0,0,0,.3);
}
.chip .e{font-size:1.6rem}
.chip .sub{display:block;font-size:.72rem;font-weight:700;opacity:.6}
.chip.used{visibility:hidden}
.chip:active{transform:translateY(3px);box-shadow:0 1px 0 rgba(0,0,0,.3)}

/* ---------- results ---------- */
.result{text-align:center;padding:14px 0}
.result .big{font-size:4.4rem;line-height:1}
.result .earn{font-size:2.4rem;letter-spacing:6px;min-height:2.8rem;margin:8px 0}
.result h2{font-size:1.5rem;margin-bottom:6px}
.result p{color:#a9cbd8;margin-bottom:18px}
.cta{
  display:block;width:100%;padding:16px;border-radius:18px;margin-top:10px;
  background:linear-gradient(180deg,#f2d089,#c99a3f);color:#412d05;
  font-family:"Fredoka";font-weight:600;font-size:1.15rem;box-shadow:0 5px 0 #7d5b17;
}
.cta.ghost{background:rgba(253,247,236,.1);color:#eadfc7;box-shadow:none;border:1px solid rgba(201,154,63,.35)}
.cta:active{transform:translateY(3px);box-shadow:0 2px 0 #7d5b17}

.credits{margin-top:26px;font-size:.74rem;color:#7ea3b2;line-height:1.6}
.credits summary{cursor:pointer;color:#9dbecb}
.credits p{margin-top:8px}

#confetti{position:fixed;inset:0;pointer-events:none;z-index:60}
.cf{position:absolute;width:9px;height:14px;border-radius:2px;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(105vh) rotate(720deg);opacity:0}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>

  "senses": [

  ],

  "match": [
    { "w": "Eyes", "s": "sight" }, { "w": "Crystalline", "s": "sight" }, { "w": "Cornea", "s": "sight" },
    { "w": "Iris", "s": "sight" }, { "w": "Retina", "s": "sight" }, { "w": "Optical nerve", "s": "sight" },
    { "w": "Ears", "s": "hear" }, { "w": "Ear bones", "s": "hear" }, { "w": "Eardrum", "s": "hear" },
    { "w": "Cochlea", "s": "hear" }, { "w": "Auditory nerve", "s": "hear" },
    { "w": "Nose", "s": "smell" }, { "w": "Nostrils", "s": "smell" }, { "w": "Nasal receptors", "s": "smell" },
    { "w": "Smelling nerve", "s": "smell" },

  ],

  "timeline": [
    { "n": "Birth", "age": "0", "e": "👶" },
    { "n": "Toddler", "age": "2–4 years", "e": "🧸" },

    { "n": "Teenager", "age": "13 years", "e": "🧑" },

  ],

  "voice": {
    "welcome": "Welcome to the Body Museum! Choose a room and let's explore your amazing body.",
    "fb-great": "Great job! That's correct!",
    "fb-yes": "Yes! Perfect!",
    "fb-star": "You are a star!",
    "fb-try": "Not quite. Try again!",
    "fb-close": "So close! Listen and try once more.",
    "fb-round": "Round complete! You earned a star!",
    "fb-perfect": "Amazing! A perfect score! I am so proud of you, Sofia!",
    "fb-order": "Perfect! That is the order of life.",
    "m-quiz": "Museum quiz! Choose the correct answer.",
    "m-match": "Sense match! Which sense does this belong to?",
    "m-time": "Life timeline! Put the stages in the right order."
  }
}
</script>

<div class="wrap">
  <header>
    <button id="back" aria-label="Back">←</button>
    <div class="brand f">🏛️ The Body <b>Museum</b></div>
    <div class="stars" aria-live="polite">⭐ <span id="totalStars">0</span></div>
  </header>

  <!-- HOME -->
  <section class="screen on" id="s-home">

<div id="confetti"></div>

<script>
const DATA = JSON.parse(document.getElementById("content").textContent);
const $ = id => document.getElementById(id);
const shuffle = a => a.map(v => [Math.random(), v]).sort((x, y) => x[0] - y[0]).map(v => v[1]);

/* ---------- stars ---------- */
let totalStars = +localStorage.getItem("human-body-stars") || 0;
const renderStars = () => $("totalStars").textContent = totalStars;
function addStars(n) {
  if (!n) return;
  totalStars += n;
  localStorage.setItem("human-body-stars", totalStars);
  renderStars();
}
renderStars();

/* ---------- sound (WebAudio, no files) ---------- */
let actx;
const ctx = () => actx ??= new (window.AudioContext || window.webkitAudioContext)();
function tone(freq, start, dur, type = "sine", vol = .18) {
  const c = ctx(), o = c.createOscillator(), g = c.createGain();
  o.type = type; o.frequency.value = freq;
  g.gain.setValueAtTime(0, c.currentTime + start);
  g.gain.linearRampToValueAtTime(vol, c.currentTime + start + .02);
  g.gain.exponentialRampToValueAtTime(.001, c.currentTime + start + dur);
  o.connect(g).connect(c.destination);
  o.start(c.currentTime + start); o.stop(c.currentTime + start + dur + .05);
}
const ding = () => { tone(880, 0, .18); tone(1320, .09, .25); };
const buzz = () => { tone(196, 0, .22, "sawtooth", .12); };
const fanfare = () => [523, 659, 784, 1047].forEach((f, i) => tone(f, i * .11, .35, "triangle", .16));
function applause() {
  const c = ctx(), buf = c.createBuffer(1, c.sampleRate * 1.4, c.sampleRate), d = buf.getChannelData(0);
  for (let i = 0; i < d.length; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / d.length, 1.6) * .5;
  const s = c.createBufferSource(); s.buffer = buf;
  const f = c.createBiquadFilter(); f.type = "bandpass"; f.frequency.value = 1600;
  s.connect(f).connect(c.destination); s.start();
}
function confetti(n = 34) {
  const box = $("confetti"), cols = ["#f2d089", "#2ec4d9", "#ff6b8a", "#43c67f", "#a78bfa"];
  for (let i = 0; i < n; i++) {
    const p = document.createElement("div");
    p.className = "cf";
    p.style.left = Math.random() * 100 + "vw";
    p.style.top = "-20px";
    p.style.background = cols[i % cols.length];
    p.style.animationDuration = (1.4 + Math.random()) + "s";
    p.style.animationDelay = (Math.random() * .35) + "s";
    box.appendChild(p);
    setTimeout(() => p.remove(), 3000);
  }
}

/* ---------- voice: pre-generated edge-tts mp3, see gen_audio.py ---------- */
const voice = new Audio();
voice.preload = "none";
function say(key) {
  if (!key) return;
  try { voice.pause(); voice.currentTime = 0; } catch (e) {}
  voice.src = "audio/" + key + ".mp3";
  voice.play().catch(() => {});
}
const praise = () => say(["fb-great", "fb-yes", "fb-star"][Math.floor(Math.random() * 3)]);
const nudge = () => say(Math.random() < .5 ? "fb-try" : "fb-close");

/* ---------- navigation ---------- */
const stack = [];
function show(id, push = true) {
  document.querySelectorAll(".screen").forEach(s => s.classList.toggle("on", s.id === id));
  if (push) stack.push(id);
  $("back").classList.toggle("on", id !== "s-home");
  window.scrollTo({ top: 0, behavior: "instant" });
}
function goHome() {
  stack.length = 0;
  try { voice.pause(); } catch (e) {}
  show("s-home", false);
  renderModes();
}
$("back").onclick = () => {
  try { voice.pause(); } catch (e) {}
  stack.pop();
  const prev = stack[stack.length - 1];
  if (!prev || prev === "s-home") return goHome();
  show(prev, false);
  if (prev === "s-halls") renderHalls();
};

/* ---------- home ---------- */
const MODES = [
  { id: "learn", e: "🏛️", n: "Learn", s: "5 museum rooms with photos and audio", c1: "#7fe3d2", c2: "#2ec4d9" },
  { id: "quiz", e: "❓", n: "Quiz", s: "12 questions · win up to 3 stars", c1: "#ffd782", c2: "#f7a531" },
  { id: "match", e: "🔎", n: "Sense Match", s: "Which sense does it belong to?", c1: "#a9f0c4", c2: "#43c67f" },
  { id: "time", e: "⏳", n: "Life Timeline", s: "Put the 6 stages in order", c1: "#d3c4ff", c2: "#a78bfa" },
];
function renderModes() {
  $("modeTiles").innerHTML = "";
  MODES.forEach(m => {
    const b = document.createElement("button");
    b.className = "tile";
    b.style.setProperty("--c1", m.c1); b.style.setProperty("--c2", m.c2);
    b.innerHTML = `<span class="e">${m.e}</span><span><span class="n">${m.n}</span><br><span class="s">${m.s}</span></span>`;
    b.onclick = () => startMode(m.id);
    $("modeTiles").appendChild(b);
  });
}
function startMode(id) {
  ctx().resume?.();
  if (id === "learn") { renderHalls(); show("s-halls"); }
  if (id === "quiz") startQuiz();
  if (id === "match") startMatch();
  if (id === "time") startTime();
}
renderModes();

/* ---------- learn ---------- */
function renderHalls() {
  $("hallTiles").innerHTML = "";
  DATA.halls.forEach((h, i) => {
    const b = document.createElement("button");
    b.className = "tile";
    b.style.setProperty("--c1", h.c2); b.style.setProperty("--c2", h.color);
    if (localStorage.getItem("human-body-read-" + h.id)) b.classList.add("done");
    b.innerHTML = `<span class="e">${h.emoji}</span><span><span class="n">${h.title}</span><br><span class="s">${h.lesson} · ${h.cards.length} exhibits</span></span>`;
    b.onclick = () => openHall(i);
    $("hallTiles").appendChild(b);
  });
}
let hall = null, cardIdx = 0;
function openHall(i) {
  hall = DATA.halls[i]; cardIdx = 0;
  document.documentElement.style.setProperty("--accent", hall.color);
  $("vocabBox").innerHTML = `<h3>Vocabulary</h3><ul>${hall.vocab.map(v => `<li><b>${v[0]}</b> — ${v[1]}</li>`).join("")}</ul>`;
  $("dots").innerHTML = hall.cards.map(() => `<span class="dot"></span>`).join("");
  show("s-learn");
  drawCard();
}
function drawCard() {
  const c = hall.cards[cardIdx];
  $("cardTag").textContent = hall.title;
  $("cardTag").style.background = hall.color;
  $("cardH").textContent = c.h;
  $("cardT").textContent = c.t;
  const pic = $("pic"), img = $("picImg");
  $("picIco").textContent = c.icon || hall.emoji;
  if (c.img) {
    pic.classList.remove("noimg");
    img.style.display = "block";
    img.alt = c.h;
    img.onerror = () => { pic.classList.add("noimg"); img.style.display = "none"; };
    img.src = "img/" + c.img;
  } else {
    pic.classList.add("noimg");
    img.removeAttribute("src");
    img.style.display = "none";
  }
  [...$("dots").children].forEach((d, i) => d.classList.toggle("on", i === cardIdx));
  $("prev").disabled = cardIdx === 0;
  $("next").textContent = cardIdx === hall.cards.length - 1 ? "✓" : "▶";
  say(c.a);
}
$("prev").onclick = () => { if (cardIdx > 0) { cardIdx--; drawCard(); } };
$("next").onclick = () => {
  if (cardIdx < hall.cards.length - 1) { cardIdx++; drawCard(); return; }
  if (!localStorage.getItem("human-body-read-" + hall.id)) {
    localStorage.setItem("human-body-read-" + hall.id, "1");
    addStars(1); ding(); confetti(20);
  }
  stack.pop(); renderHalls(); show("s-halls", false);
};
$("replay").onclick = () => say(hall.cards[cardIdx].a);

/* ---------- results ---------- */
let replay = null;
function result(score, total, emojiWin) {
  const stars = score === total ? 3 : score >= Math.ceil(total * .75) ? 2 : score >= Math.ceil(total * .5) ? 1 : 0;
  addStars(stars);
  $("rEmoji").textContent = stars === 3 ? "🏆" : stars === 2 ? emojiWin : stars === 1 ? "💪" : "📚";
  $("rStars").textContent = "⭐".repeat(stars) || "☆";
  $("rTitle").textContent = `${score} / ${total} correct`;
  $("rText").textContent =
    stars === 3 ? "A perfect score! You know the whole museum!" :
    stars === 2 ? "Almost perfect! Great work!" :
    stars === 1 ? "Good try! Visit the rooms again and come back for more stars." :
                  "Let's learn in the museum rooms and try again!";
  if (stars >= 2) { applause(); confetti(44); }
  if (stars === 3) { fanfare(); say("fb-perfect"); } else if (stars >= 1) say("fb-round");
  stack.length = 0;
  show("s-result");
}
$("rAgain").onclick = () => { stack.pop(); replay?.(); };
$("rHome").onclick = goHome;

/* ---------- quiz ---------- */
const QN = 12;
let qList = [], qi = 0, qScore = 0;
function startQuiz() {
  replay = startQuiz;
  qList = shuffle(DATA.quiz).slice(0, QN).map(q => {
    const correct = q.o[q.c];
    return { ...q, o: shuffle(q.o), c: -1, correct };
  });
  qi = 0; qScore = 0;
  show("s-quiz");
  drawQ();
}
function drawQ() {
  const q = qList[qi];
  $("qbarFill").style.width = (qi / QN * 100) + "%";
  $("qCount").textContent = `${qi + 1} / ${QN}`;
  $("qText").textContent = q.q;
  $("qMsg").textContent = "";
  $("qOpts").innerHTML = "";
  q.o.forEach(opt => {
    const b = document.createElement("button");
    b.className = "opt"; b.textContent = opt;
    b.onclick = () => answerQ(b, opt === q.correct);
    $("qOpts").appendChild(b);
  });
  say(q.a);
}
$("qSpeak").onclick = () => say(qList[qi].a);
function answerQ(btn, good) {
  const q = qList[qi];
  [...$("qOpts").children].forEach(b => {
    b.disabled = true;
    if (b.textContent === q.correct) b.classList.add("ok");
  });
  if (good) { qScore++; btn.classList.add("ok"); ding(); praise(); $("qMsg").textContent = "✅ Correct!"; }
  else { btn.classList.add("bad"); buzz(); nudge(); $("qMsg").textContent = "That one was: " + q.correct; }
  setTimeout(() => {
    qi++;
    if (qi < QN) drawQ();
    else { $("qbarFill").style.width = "100%"; result(qScore, QN, "🔬"); }
  }, good ? 1000 : 2000);
}

/* ---------- sense match ---------- */
const MN = 10;
let mList = [], mi = 0, mScore = 0, mLock = false;
function startMatch() {
  replay = startMatch;
  mList = shuffle(DATA.match).slice(0, MN);
  mi = 0; mScore = 0;
  $("mSenses").innerHTML = "";
  DATA.senses.forEach(s => {
    const b = document.createElement("button");
    b.className = "sense"; b.dataset.id = s.id;
    b.innerHTML = `<span class="e">${s.e}</span>${s.name}`;
    b.onclick = () => answerM(b, s.id);
    $("mSenses").appendChild(b);
  });
  show("s-match");
  say("m-match");
  drawM();
}
function drawM() {
  mLock = false;
  $("mbarFill").style.width = (mi / MN * 100) + "%";
  $("mWord").textContent = mList[mi].w;
  $("mMsg").textContent = "";
  [...$("mSenses").children].forEach(b => b.className = "sense");
}
function answerM(btn, id) {
  if (mLock) return;
  mLock = true;
  const item = mList[mi];
  const good = id === item.s;
  const right = DATA.senses.find(s => s.id === item.s);
  if (good) { mScore++; btn.classList.add("ok"); ding(); praise(); $("mMsg").textContent = "✅ Yes!"; }
  else {
    btn.classList.add("bad"); buzz(); nudge();
    [...$("mSenses").children].find(b => b.dataset.id === item.s).classList.add("ok");
    $("mMsg").textContent = `"${item.w}" belongs to ${right.name}`;
  }
  setTimeout(() => {
    mi++;
    if (mi < MN) drawM();
    else { $("mbarFill").style.width = "100%"; result(mScore, MN, "🔎"); }
  }, good ? 900 : 1900);
}

/* ---------- life timeline ---------- */
let tPlaced = 0, tWrong = 0;
function startTime() {
  replay = startTime;
  tPlaced = 0; tWrong = 0;
  $("tSlots").innerHTML = DATA.timeline.map(() => `<div class="slot">?</div>`).join("");
  $("tMsg").textContent = "";
  $("tPool").innerHTML = "";
  shuffle(DATA.timeline.map((s, i) => ({ ...s, i }))).forEach(s => {
    const b = document.createElement("button");
    b.className = "chip";
    b.innerHTML = `<span class="e">${s.e}</span><span>${s.n}<span class="sub">${s.age}</span></span>`;
    b.onclick = () => placeT(b, s);
    $("tPool").appendChild(b);
  });
  show("s-time");
  say("m-time");
}
function placeT(btn, s) {
  if (s.i !== tPlaced) {
    tWrong++; buzz(); nudge();
    $("tMsg").textContent = "Not yet — what comes first?";
    btn.animate([{ transform: "translateX(-6px)" }, { transform: "translateX(6px)" }, { transform: "none" }], 220);
    return;
  }
  const slot = $("tSlots").children[tPlaced];
  slot.classList.add("f");
  slot.textContent = s.e;
  btn.classList.add("used");
  tPlaced++; ding();
  $("tMsg").textContent = `${s.n} · ${s.age}`;
  if (tPlaced === DATA.timeline.length) {
    say("fb-order");
    setTimeout(() => result(Math.max(0, 6 - tWrong), 6, "⏳"), 1200);
  }
}

/* ---------- photo credits ---------- */
fetch("img/credits.json")
  .then(r => r.ok ? r.json() : Promise.reject())
  .then(list => {
    $("creditList").innerHTML = list.map(c =>
      `<p>${c.shows || c.name} — <i>${c.title}</i>, ${c.author || "Unknown"} (${c.license}), Wikimedia Commons.</p>`).join("");
  })
  .catch(() => $("creditList").innerHTML = "<p>Photos from Wikimedia Commons under free licences (Public domain, CC0, CC BY, CC BY-SA).</p>");

/* first tap unlocks audio on iOS */
document.body.addEventListener("pointerdown", function once() {
  ctx().resume?.();
  say("welcome");
  document.body.removeEventListener("pointerdown", once);
}, { once: true });
</script>
